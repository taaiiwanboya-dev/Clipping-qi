<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ViralClip AI V2</title>
<style>
body{margin:0;background:#090b10;color:#fff;font-family:system-ui;padding:18px}
main{max-width:820px;margin:auto}.card{background:#151923;border:1px solid #292f3d;border-radius:18px;padding:20px;margin:14px 0}
h1{margin:0}.muted{color:#9ba4b5}input,select,button{width:100%;padding:13px;border-radius:12px;border:1px solid #343b4c;background:#0e121a;color:#fff;margin-top:8px;box-sizing:border-box}
button{background:#6d5dfc;border-color:#6d5dfc;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
pre{white-space:pre-wrap;background:#0d1118;padding:14px;border-radius:12px}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<section class="card">
<h1>🔥 ViralClip AI V2</h1>
<p class="muted">Masukkan URL YouTube → backend menerima job → siap dihubungkan ke pipeline transkripsi & editing.</p>
<label>URL YouTube</label>
<input id="url" placeholder="https://www.youtube.com/watch?v=..." />
<div class="grid">
<div><label>Jumlah clip</label><select id="count"><option>5</option><option selected>10</option><option>20</option><option>30</option></select></div>
<div><label>Durasi</label><select id="duration"><option>20</option><option selected>30</option><option>45</option><option>60</option></select></div>
<div><label>Format</label><select id="ratio"><option selected>9:16</option><option>1:1</option><option>16:9</option></select></div>
</div>
<button id="start">🚀 Analisis URL</button>
</section>
<section class="card">
<h3>Status</h3><pre id="out">Menunggu URL...</pre>
</section>
</main>
<script>
const out=document.getElementById("out");
document.getElementById("start").onclick=async()=>{
 const url=document.getElementById("url").value.trim();
 if(!url){out.textContent="Masukkan URL YouTube.";return}
 out.textContent="Mengirim job ke backend...";
 try{
   const r=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({url,count:count.value,duration:duration.value,ratio:ratio.value})});
   const data=await r.json();
   out.textContent=r.ok
    ? `Job dibuat!\nID: ${data.id}\nURL: ${data.url}\nClip: ${data.count}\nDurasi: ${data.duration}s\nFormat: ${data.ratio}\n\n${data.message}`
    : (data.error||"Terjadi error.");
 }catch(e){out.textContent="Backend belum berjalan. Jalankan: npm install lalu npm start";}
};
</script>
</body>
</html>
